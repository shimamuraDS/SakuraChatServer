name: Server images
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Deployment tests
        run: python3 -m unittest discover -s deploy/tests -v
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image namespace
        id: names
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: C++ servers and tests
        id: server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
          tags: ${{ steps.names.outputs.prefix }}-server:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Verification service
        id: verify
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile.verify
          platforms: linux/amd64
          load: true
          push: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
          tags: ${{ steps.names.outputs.prefix }}-verify:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=verify
          cache-to: type=gha,mode=max,scope=verify
      - name: Single-node Swarm smoke test
        env:
          SERVER_IMAGE: ${{ steps.names.outputs.prefix }}-server:sha-${{ github.sha }}
          VERIFY_IMAGE: ${{ steps.names.outputs.prefix }}-verify:sha-${{ github.sha }}
        run: bash deploy/tests/swarm-smoke.sh
      - name: Prepare atomic release manifest
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          PREFIX: ${{ steps.names.outputs.prefix }}
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          VERIFY_DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          mkdir -p /tmp/sakura-release
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          prefix = os.environ['PREFIX']
          data = {'schema': 1, 'revision': os.environ['GITHUB_SHA'], 'images': {
              'server': prefix + '-server@' + os.environ['SERVER_DIGEST'],
              'verify': prefix + '-verify@' + os.environ['VERIFY_DIGEST']}}
          Path('/tmp/sakura-release/release.json').write_text(json.dumps(data))
          Path('/tmp/sakura-release/Dockerfile').write_text('FROM scratch\nCOPY release.json /release.json\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Immutable deployment images\n```json\n' + json.dumps(data, indent=2) + '\n```\n')
          PY
      - name: Publish release pointer after all builds succeed
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: /tmp/sakura-release
          push: true
          tags: ${{ steps.names.outputs.prefix }}-release:stable
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
